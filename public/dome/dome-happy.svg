  <g fill="#EAB532">
    <path d="M172 52 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 Z"/>
    <path d="M28 44 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="โดมชูสองมือดีใจ">
  <title>โดมชูสองมือดีใจ</title>
  <ellipse cx="100" cy="186" rx="46" ry="8" fill="#2C2644" opacity="0.08"/>

  <!-- ชูสองมือ -->
  <g stroke="#7651D3" stroke-width="4" stroke-linecap="round" fill="#A28AF6">
    <path d="M136 136 L154 116" stroke-width="13"/>
    <circle cx="158" cy="110" r="11"/>
    <path d="M64 136 L46 116" stroke-width="13"/>
    <circle cx="42" cy="110" r="11"/>
  </g>

  <!-- ลำตัว -->
  <rect x="62" y="122" width="76" height="54" rx="24" fill="#FFFFFF" stroke="#7651D3" stroke-width="4"/>
  <path d="M100 128 L109 140 L100 158 L91 140 Z" fill="#ED7A2D"/>


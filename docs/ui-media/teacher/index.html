<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Teacher CMS responsive evidence</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f5f3ef; color: #252321; }
      body { margin: 0; padding: 32px; }
      h1 { margin: 0 0 8px; font-size: 28px; }
      p { color: #625f5b; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
      figure { margin: 0; padding: 10px; background: #fffefa; border: 1px solid #dedbd5; border-radius: 10px; }
      img { display: block; width: 100%; height: 220px; object-fit: contain; object-position: top center; background: #ece9e3; border-radius: 6px; }
      figcaption { padding: 10px 2px 2px; font-size: 14px; font-weight: 650; }
      code { font-weight: 500; color: #625f5b; }
    </style>
  </head>
  <body>
    <h1>Teacher CMS responsive evidence</h1>
    <p>Headless Chromium captures from the authenticated UAT777 teacher account. Every route was checked at 1920, 1440, 1280, 1024, 768, and 390 CSS pixels; all checks reported <code>scrollWidth === clientWidth</code>.</p>
    <main class="grid" id="gallery"></main>
    <script>
      const routes = [
        ['teacher', 'คุมคาบสด'], ['teacher-board', 'ห้องเรียนสด'], ['teacher-student', 'รายงานรายคน'],
        ['teacher-review', 'งานรอตรวจ'], ['teacher-requests', 'คำขอจากนักเรียน'], ['teacher-report', 'รายงานรายห้อง'],
        ['teacher-showcase', 'ผลงานและจอหน้าห้อง'], ['teacher-settings', 'ตั้งค่าห้อง'], ['teacher-demo', 'โหมดสาธิต']
      ];
      const widths = [1920, 1440, 1280, 1024, 768, 390];
      const gallery = document.querySelector('#gallery');
      for (const [slug, label] of routes) for (const width of widths) {
        const figure = document.createElement('figure');
        figure.innerHTML = `<a href="${slug}-${width}.png"><img loading="lazy" src="${slug}-${width}.png" alt="${label} ที่ความกว้าง ${width}px"></a><figcaption>${label} · <code>${width}px</code></figcaption>`;
        gallery.append(figure);
      }
    </script>
  </body>
</html>
